# The seshi relay. It forwards sealed frames between two paired people and
# holds them for whoever is offline. It sees ciphertext and two routing
# fingerprints, and cannot read a word of what either side says.

app = "seshi-relay"
primary_region = "syd"

[build]

[http_service]
  internal_port = 8787
  force_https = true

  # State is in memory: pairing mailboxes, and frames queued for whoever is
  # offline. So one machine, always awake. A machine that sleeps drops the
  # queue, and a second machine splits it, leaving two people who landed on
  # different ones waiting for each other forever.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[checks]
  # TCP, not HTTP: a WebSocket server answers a plain GET with 426 Upgrade
  # Required, which an HTTP check reads as broken.
  [checks.alive]
    type = "tcp"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
