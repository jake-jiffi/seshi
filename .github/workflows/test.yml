name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The client has no runtime dependencies. `ws` and TypeScript are dev only.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
